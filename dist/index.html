<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f38" />
    <meta name="description" content="A classroom speaking game for productive EIKEN vocabulary practice." />
    <title>EIKEN Word Tactics</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Word Tactics" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to game setup</a>
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="EIKEN Word Tactics home">
        <span class="brand-mark" aria-hidden="true"><img src="./assets/decor/nathan-seal.webp" alt="" width="44" height="44" /></span>
        <span><strong>EIKEN</strong><small>WORD TACTICS</small></span>
      </button>
      <div class="topbar-actions">
        <span id="offline-status" class="offline-status" aria-live="polite">Online</span>
        <span class="version" aria-label="Application version">v1.3.1</span>
        <button class="icon-button" type="button" data-action="settings" aria-label="Open teacher settings">⚙</button>
      </div>
    </header>
    <main id="app">
      <section class="loading-card" aria-busy="true">
        <span class="crest" aria-hidden="true">英</span>
        <h1>Preparing the word deck…</h1>
        <p>Loading your EIKEN vocabulary.</p>
      </section>
    </main>
    <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
    <noscript>This game needs JavaScript enabled.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
